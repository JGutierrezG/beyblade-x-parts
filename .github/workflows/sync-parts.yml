name: Sync Beyblade X parts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"   # every Monday 09:00 UTC — picks up newly released parts

permissions:
  contents: write          # only scope needed: commit images/manifest back to this repo

concurrency:
  group: sync-parts
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r requirements.txt

      - name: Sync images from Beyblade Wiki
        run: .venv/bin/python scripts/sync_parts.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images manifest.json CATALOG.md
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore(sync): update Beyblade X parts from wiki [$(date -u +%Y-%m-%d)]"
            git push
          fi
